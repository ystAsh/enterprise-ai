<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enterprise AI - 로그인</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 400px;
            padding: 40px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .login-box h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 26px;
        }

        .login-box .description {
            margin-bottom: 30px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 5px;
            background-color: #2563eb;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #1d4ed8;
        }

        .message {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
        }

        .error-message {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .logout-message {
            background-color: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Enterprise AI</h1>

        <div class="description">
            사내 AI 시스템
        </div>

        <!-- Spring Security 로그인 실패 시 표시한다. -->
        <div th:if="${param.error}"
             class="message error-message">
            아이디 또는 비밀번호를 확인해주세요.
        </div>

        <!-- 정상적으로 로그아웃된 경우 표시한다. -->
        <div th:if="${param.logout}"
             class="message logout-message">
            로그아웃되었습니다.
        </div>

        <!-- username/password만 전달하고 권한정보는 브라우저에서 받지 않는다. -->
        <form th:action="@{/login}"
              method="post">

            <div class="form-group">
                <label for="username">아이디</label>

                <input type="text"
                       id="username"
                       name="username"
                       autocomplete="username"
                       required
                       autofocus>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>

                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="current-password"
                       required>
            </div>

            <button type="submit"
                    class="login-button">
                로그인
            </button>

        </form>

    </div>

</div>

</body>
</html>
