<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Enterprise Spring AI</title>

    <style>

        body{
            width:900px;
            margin:30px auto;
            font-family:Arial;
        }

        textarea{
            width:100%;
            height:120px;
            font-size:16px;
        }

        button{
            margin-top:10px;
            width:120px;
            height:40px;
        }

        #answer{
            margin-top:30px;
            padding:15px;
            border:1px solid #cccccc;
            min-height:200px;
            white-space:pre-wrap;
        }

    </style>

</head>

<body>

<h2>Enterprise Spring AI</h2>

<textarea
        id="question"
        placeholder="질문을 입력하세요.">
</textarea>

<br>

<button onclick="sendQuestion()">

    질문하기

</button>

<div id="answer">

</div>

<script>

    async function sendQuestion(){

        const question =
            document.getElementById("question").value;

        const response =
            await fetch("/api/chat",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    question:question
                })

            });

        const result =
            await response.json();

        document.getElementById("answer").innerText =
            result.answer;

    }

</script>

</body>

</html>
