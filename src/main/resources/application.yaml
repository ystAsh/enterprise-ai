spring:
  application:
    name: enterprise-ai

  # ===============================
  # MSSQL Database - Primary
  # ===============================
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=enterprise_ai;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${MSSQL_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # ===============================
  # JPA
  # ===============================
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ===============================
  # Flyway - MSSQL
  # ===============================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
    baseline-description: Initial existing MSSQL schema

  # ===============================
  # Spring AI
  # ===============================
  ai:
    # PgVector 자동 설정을 사용하지 않는다.
    # PostgreSQL 전용 JdbcTemplate을 다음 단계에서 직접 연결한다.
    vectorstore:
      type: none

    model:
      chat: google-genai
      embedding:
        text: google-genai

    google:
      genai:
        api-key: ${GEMINI_API_KEY}

        chat:
          model: gemini-2.5-flash
          temperature: 0.3
          max-output-tokens: 1000

        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  upload:
    vector-document-directory: ./uploads/vector-documents

  # ===============================
  # PostgreSQL - Vector DB Only
  # ===============================
  datasource:
    vector:
      url: jdbc:postgresql://localhost:5433/enterprise_ai_vector
      username: ${VECTOR_DB_USERNAME}
      password: ${VECTOR_DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

server:
  port: 8080